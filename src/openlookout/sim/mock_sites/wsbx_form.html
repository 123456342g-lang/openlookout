<!doctype html><html><head><meta charset="utf-8"><title>填写报销单 - 网上报销系统（仿制页，用于本地测试）</title></head>
<body><h3>填写报销单</h3>
<form id="f" onsubmit="document.body.setAttribute('data-submitted','1');return false;">
<div><label for="fp">发票号码：</label><input id="fp"></div>
<div><label for="rq">开票日期：</label><input id="rq"></div>
<div><label for="xs">销售方名称：</label><input id="xs"></div>
<div><label for="hj">价税合计：</label><input id="hj"></div>
<div><label for="se">税额：</label><input id="se"></div>
<div><label for="kh">经费卡号：</label><input id="kh"></div>
<div><label for="sy">报销事由：</label><input id="sy"></div>
<button type="submit">提交</button></form></body></html>
